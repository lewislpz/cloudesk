name: CI
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - run: npm install --global pnpm@10.15.1
      - run: pnpm install --frozen-lockfile
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/ci.yml
      - run: pnpm check
      - run: go -C backend test -race -count=1 ./...
      - run: go -C backend mod verify
      - run: pnpm build
      - run: pnpm --dir frontend test:e2e
      - run: make docs-check
      - run: python3 scripts/test-ci.py
      - run: python3 scripts/check-migration-history.py
      - run: bash .codex/scripts/verify-control-plane.sh
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - run: npm install --global pnpm@10.15.1
      - run: pnpm install --frozen-lockfile
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .
      - run: python3 scripts/test-secret-scanner.py
      - run: pnpm audit --audit-level high
      - run: go -C backend run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
  images:
    needs: [checks, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - run: npm install --global pnpm@10.15.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:images
      - name: Inventory and scan runtime images
        run: sh scripts/scan-container-images.sh "$RUNNER_TEMP/sbom"
  required:
    if: always()
    needs: [checks, security, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
