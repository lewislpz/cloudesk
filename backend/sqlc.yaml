version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/*.up.sql"
    queries: "queries"
    gen:
      go:
        package: "dbgen"
        out: "internal/gen/sqlc"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_interface: true
        emit_pointers_for_null_types: true
