name: clouddesk-local

x-postgres-service: &postgres-service
  image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
  environment:
    POSTGRES_DB: clouddesk
    POSTGRES_USER: clouddesk_local
    POSTGRES_PASSWORD: ${CLOUDESK_LOCAL_DB_PASSWORD:-clouddesk-local-only}
    POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
  ports:
    - 127.0.0.1:${CLOUDESK_LOCAL_DB_PORT:-5432}:5432
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 2s
    timeout: 5s
    retries: 15
    start_period: 5s
  networks:
    - dependencies
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s

x-oidc-service: &oidc-service
  image: ghcr.io/dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
  command: ["dex", "serve", "/etc/dex/config.yaml"]
  environment:
    DEX_CLIENT_ID: clouddesk-local
    DEX_CLIENT_SECRET: ${CLOUDESK_LOCAL_OIDC_CLIENT_SECRET:-clouddesk-local-only}
    DEX_LOCAL_PASSWORD_HASH: ${CLOUDESK_LOCAL_OIDC_PASSWORD_HASH:-$$2a$$10$$oiuw8.HeYdXM2wESr6JMkefC3m4kCAoYKsyDsIP4okeQnI3NcUM.O}
  ports:
    - 127.0.0.1:${CLOUDESK_LOCAL_OIDC_PORT:-5556}:5556
  expose:
    - "5558"
  volumes:
    - ./config/local/dex/config.yaml:/etc/dex/config.yaml:ro
  healthcheck:
    test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5558/healthz"]
    interval: 2s
    timeout: 5s
    retries: 15
    start_period: 5s
  networks:
    - dependencies
  read_only: true
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 15s

services:
  postgres:
    <<: *postgres-service
    volumes:
      - postgres-data:/var/lib/postgresql/data

  oidc:
    <<: *oidc-service
    volumes:
      - ./config/local/dex/config.yaml:/etc/dex/config.yaml:ro
      - oidc-data:/var/dex
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 01777

  postgres-ephemeral:
    <<: *postgres-service
    profiles: ["ephemeral"]
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,size=512m

  oidc-ephemeral:
    <<: *oidc-service
    profiles: ["ephemeral"]
    tmpfs:
      - /var/dex:rw,nosuid,size=64m,uid=1001,gid=1001
      - /tmp:rw,nosuid,size=16m,mode=1777

networks:
  dependencies:
    driver: bridge

volumes:
  postgres-data:
  oidc-data:
